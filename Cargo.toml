[package]
name = "jotpad"
version = "0.1.0"
edition = "2021"
description = "A lightweight desktop notepad for Linux with Markdown and text-focused DOCX support"

[[bin]]
name = "jotpad"
path = "src/main.rs"

[dependencies]
docx-rs = "0.4.22"
eframe = "0.31"
pulldown-cmark = "0.12"
rfd = "0.15"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[package.metadata.deb]
maintainer = "Aayan Laggard <your-email@example.com>"
copyright = "Copyright (C) 2026 Aayan Laggard"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/jotpad", "usr/bin/", "755"],
    ["assets/jotpad.desktop", "usr/share/applications/", "644"],
    ["assets/jotpad.svg", "usr/share/pixmaps/", "644"],
]
