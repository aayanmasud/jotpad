[package]
name = "jotpad"
version = "0.1.0"
edition = "2021"
description = "A lightweight desktop notepad for Linux with text-focused DOCX support"

[[bin]]
name = "jotpad"
path = "src/main.rs"

[dependencies]
docx-rs = "0.4.22"
ef rame = "0.31"
pulldown-cmark = "0.12"
rfd = "0.15"
roxmltree = "0.20"
zip = { version = "4", default-features = false, features = ["deflate"] }
